# ensis-site 持续集成：类型检查、Go 测试、前端构建。
# ensis-ui 从 npm 拉取（默认 latest），不 checkout 兄弟 Git 仓库。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ensis-site
    steps:
      - name: Checkout ensis-site
        uses: actions/checkout@v7
        with:
          path: ensis-site

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ensis-site/pnpm-lock.yaml

      - name: Changelog release script
        run: node --test .github/scripts/cut-changelog.test.mjs

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: ensis-site/server/go.sum

      - name: Install JS dependencies
        run: |
          UI="${{ vars.NIUMA_UI_VERSION || 'latest' }}"
          pnpm pkg set "dependencies.@niuma/ui=npm:ensis-ui@${UI}"
          pnpm install --no-frozen-lockfile

      - name: Typecheck and frontend build
        run: pnpm build
        env:
          VITE_SITE_API_BASE: ''
          VITE_CLOUD_API_BASE: /niuma/cloud

      - name: Go tests
        run: pnpm test:server
